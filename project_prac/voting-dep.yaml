

---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: voting-pod
  labels:
    app: votingapp
    name: voting
spec: 
  selector: 
    matchLabels:
      app: votingapp
      name: voting
  replicas: 2
  template:
    metadata:
      labels:
        app: votingapp
        name: voting
    spec:
      containers:
        - name: voting-cont
          image: dockersamples/examplevotingapp_vote
          ports:
            - containerPort: 80
              
