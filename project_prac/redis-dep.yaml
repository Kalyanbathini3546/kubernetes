---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: votingapp
    name: redis
spec:
  selector:
    matchLabels:
      app: votingapp
      name: redis
  replicas: 2
  template:
    metadata:
      labels:
        app: votingapp
        name: redis
    spec:
      containers:
        - name: redis-container
          image: redis:latest
          ports:
            - containerPort: 6379
